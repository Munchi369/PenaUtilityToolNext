[versions]
compose = "1.12.0"
compose-material3 = "1.12.0-alpha03"
derby = "10.14.2.0"
junit-jupiter = "6.0.1"
kotlin = "2.4.21"
kotlinx-serialization = "1.10.0"
kotlinx-collections-immutable = "0.5.1"
ktlint-gradle = "14.2.0"
snakeyaml = "2.6"
white-wind-table = "3.6.0"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
derby = { module = "org.apache.derby:derby", version.ref = "derby" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
white-wind-table = { module = "ua.wwind.table-kmp:table-core", version.ref = "white-wind-table" }

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
